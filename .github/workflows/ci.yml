name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # package.json의 packageManager 필드에 적힌 pnpm 버전을 쓴다
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: API 타입이 openapi 사본과 맞는지 확인
        run: |
          pnpm gen:api
          git diff --exit-code -- src/shared/api/schema.d.ts

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
