openapi: 3.1.0
info:
  title: 개인 블로그 API
  version: 1.0.0
  description: |
    개인 블로그 플랫폼의 API 설계 기준 문서입니다. 설계 문서의 "API 명세" 탭과 내용이 같습니다.

    공통 규약
    - 형식: application/json; charset=UTF-8, 필드명은 camelCase
    - ID: 53비트 정수 (JSON number)
    - 일시: ISO 8601 UTC (예: 2026-11-02T05:30:00Z)
    - 값이 없으면 필드를 생략하지 않고 null로 보냅니다. 빈 목록은 []
    - 목록은 커서 페이지네이션 (cursor, size → items, nextCursor)
    - 실패 응답은 RFC 9457 Problem Details (application/problem+json)이며, 클라이언트는 code로 분기합니다
    - 모든 응답에 X-Request-Id 헤더가 붙습니다. 요청에 넣어 보내면 그 값을 그대로 씁니다
servers:
  - url: http://localhost:8080/api/v1
    description: local
  - url: https://api.example.com/api/v1
    description: prod (도메인 확정 후 교체)
tags:
  - name: Articles
    description: 공개 게시글 조회
  - name: Tags
    description: 태그 조회
  - name: Comments
    description: 댓글
  - name: Admin Articles
    description: 관리자 게시글 관리 (ADMIN)
  - name: Media
    description: 이미지 업로드 (ADMIN)
  - name: Auth
    description: 로그인과 토큰

paths:
  /articles:
    get:
      tags: [Articles]
      operationId: listArticles
      summary: 발행된 글 목록
      description: PUBLISHED 상태의 글만 publishedAt 내림차순으로 돌려줍니다.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
        - name: tag
          in: query
          description: 태그 이름으로 거르기
          schema:
            type: string
            minLength: 1
            maxLength: 30
      responses:
        '200':
          description: 글 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleSummaryPage'
              example:
                items:
                  - id: 371234567890123
                    title: 모듈러 모놀리스로 블로그 만들기
                    summary: 컨텍스트마다 core와 어댑터를 나누고...
                    thumbnailUrl: https://img.example.com/2026/11/a1b2.webp
                    tags:
                      - id: 371230000000001
                        name: spring
                    publishedAt: '2026-11-02T05:30:00Z'
                nextCursor: eyJwIjoiMjAyNi0xMS0wMlQwNTozMDowMFoiLCJpIjozNzEyMzQ1Njc4OTAxMjN9
        '400':
          $ref: '#/components/responses/BadRequest'

  /articles/search:
    get:
      tags: [Articles]
      operationId: searchArticles
      summary: 글 검색
      description: 제목과 본문에서 검색합니다. 정렬은 관련도가 아니라 publishedAt 내림차순입니다.
      parameters:
        - name: q
          in: query
          required: true
          description: 검색어 (ngram 토큰 크기 2 기준)
          schema:
            type: string
            minLength: 2
            maxLength: 50
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /articles/{articleId}:
    get:
      tags: [Articles]
      operationId: getArticle
      summary: 발행된 글 상세
      description: DRAFT나 DELETED 글은 존재를 숨기기 위해 404로 응답합니다.
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: 글 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /tags/top:
    get:
      tags: [Tags]
      operationId: getTopTags
      summary: 많이 쓰인 태그
      parameters:
        - name: n
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 10
      responses:
        '200':
          description: 발행된 글 수 기준 상위 태그
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagCount'

  /articles/{articleId}/comments:
    get:
      tags: [Comments]
      operationId: listComments
      summary: 댓글 목록
      description: 최상위 댓글은 작성순이며 대댓글은 replies 안에 들어갑니다. HIDDEN 댓글은 제외합니다.
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: 댓글 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      operationId: createComment
      summary: 댓글 또는 대댓글 작성
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
            example:
              content: outbox 릴레이 주기는 어떻게 정하셨나요?
              parentId: 371240000000010
      responses:
        '201':
          description: 작성된 댓글
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /comments/{commentId}:
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: 댓글 삭제
      description: 작성자나 ADMIN만 지울 수 있습니다. 대댓글이 있으면 DELETED로 자리만 남습니다. 이미 지운 댓글은 204입니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/articles:
    get:
      tags: [Admin Articles]
      operationId: listAdminArticles
      summary: 전체 글 목록 (초안·삭제 포함)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ArticleStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: updatedAt 내림차순 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticleSummaryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin Articles]
      operationId: createDraft
      summary: 빈 초안 생성
      security:
        - bearerAuth: []
      responses:
        '201':
          description: 생성된 초안
          headers:
            Location:
              description: 생성된 글의 관리자 상세 경로
              schema:
                type: string
              example: /api/v1/admin/articles/371234567890123
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/articles/{articleId}:
    get:
      tags: [Admin Articles]
      operationId: getAdminArticle
      summary: 초안을 포함한 글 상세
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: 글 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin Articles]
      operationId: deleteArticle
      summary: 소프트 삭제
      description: DRAFT나 PUBLISHED 글을 DELETED로 바꾸고 태그를 뗍니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/articles/{articleId}/draft:
    put:
      tags: [Admin Articles]
      operationId: saveDraft
      summary: 초안 저장 (자동 저장 포함)
      description: 요청의 version이 현재 값과 다르면 저장하지 않고 409 ARTICLE_VERSION_CONFLICT로 응답합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftUpdateRequest'
            example:
              title: 모듈러 모놀리스로 블로그 만들기
              contents: "## 왜 모놀리스인가\n..."
              thumbnailUrl: null
              version: 7
      responses:
        '200':
          description: 저장된 글 (version 증가)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/articles/{articleId}/publish:
    post:
      tags: [Admin Articles]
      operationId: publishArticle
      summary: 발행 또는 재발행
      description: 초안 내용을 발행본으로 복사하고 PUBLISHED로 바꿉니다. 이미 PUBLISHED면 재발행입니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: 발행된 글
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/articles/{articleId}/unpublish:
    post:
      tags: [Admin Articles]
      operationId: unpublishArticle
      summary: 발행 취소
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: DRAFT로 돌아간 글
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/articles/{articleId}/restore:
    post:
      tags: [Admin Articles]
      operationId: restoreArticle
      summary: 삭제 복구
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: DRAFT로 복구된 글
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/articles/{articleId}/tags:
    put:
      tags: [Admin Articles]
      operationId: replaceArticleTags
      summary: 태그 목록 교체
      description: 보낸 목록으로 태그를 통째로 바꿉니다. 없는 이름은 새 태그로 만듭니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagsUpdateRequest'
            example:
              tagNames: [spring, architecture, ddd]
      responses:
        '200':
          description: 태그가 바뀐 글
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/media/upload-urls:
    post:
      tags: [Media]
      operationId: createUploadUrl
      summary: presigned 업로드 URL 발급
      description: media 행을 PENDING으로 만들고 10분짜리 업로드 URL을 발급합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
            example:
              fileName: architecture.webp
              contentType: image/webp
              sizeBytes: 284512
      responses:
        '201':
          description: 업로드 URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/media/{mediaId}/confirm:
    post:
      tags: [Media]
      operationId: confirmMedia
      summary: 업로드 완료 확인
      description: 스토리지에 객체가 있고 크기가 신고한 값과 같으면 CONFIRMED로 바꿉니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: 확인된 미디어
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /oauth2/authorization/google:
    servers:
      - url: http://localhost:8080
      - url: https://api.example.com
    get:
      tags: [Auth]
      operationId: startGoogleLogin
      summary: Google 로그인 시작
      description: Spring Security OAuth2 Client 기본 경로라 /api/v1 밖에 있습니다.
      responses:
        '302':
          description: Google 인가 페이지로 이동
          headers:
            Location:
              schema:
                type: string

  /login/oauth2/code/google:
    servers:
      - url: http://localhost:8080
      - url: https://api.example.com
    get:
      tags: [Auth]
      operationId: googleCallback
      summary: Google 로그인 콜백
      description: 성공하면 refresh 쿠키를 심고 프론트의 /auth/callback으로 보냅니다. 실패하면 error 파라미터를 붙여 보냅니다. URL에 토큰을 싣지 않습니다.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: 프론트 콜백 페이지로 이동
          headers:
            Location:
              schema:
                type: string
              example: https://blog.example.com/auth/callback
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: access 토큰 재발급
      description: refresh 토큰은 쓸 때마다 교체됩니다. 이미 교체된 토큰이 다시 오면 그 사용자의 refresh 토큰을 모두 폐기하고 401 REFRESH_TOKEN_REUSED로 응답합니다.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 새 access 토큰과 새 refresh 쿠키
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃
      description: refresh 토큰을 폐기하고 쿠키를 지웁니다.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 로그아웃됨
          headers:
            Set-Cookie:
              description: Max-Age=0으로 refresh 쿠키 삭제
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: 내 계정 정보
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 계정 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15분짜리 access 토큰. 클레임은 sub, role, iat, exp
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly, Secure, SameSite=Lax, Path=/api/v1/auth, 14일

  parameters:
    Cursor:
      name: cursor
      in: query
      description: 이전 응답의 nextCursor. 내용은 해석하지 않고 그대로 보냅니다
      schema:
        type: string
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'

  headers:
    RefreshCookie:
      description: refresh_token=<값>; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=1209600
      schema:
        type: string
    RetryAfter:
      description: 다시 시도할 수 있을 때까지 남은 초
      schema:
        type: integer

  responses:
    BadRequest:
      description: 입력 검증 실패 (VALIDATION_FAILED, INVALID_CURSOR, INVALID_SEARCH_QUERY, UNSUPPORTED_MEDIA_TYPE, MEDIA_TOO_LARGE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/validation-failed
            title: Validation failed
            status: 400
            detail: 요청 값 2개가 올바르지 않습니다.
            instance: /api/v1/admin/articles/371234567890123/tags
            code: VALIDATION_FAILED
            requestId: 01JC8V3A0KX2
            errors:
              - field: tagNames
                reason: 태그는 최대 10개까지 붙일 수 있습니다.
              - field: tagNames[3]
                reason: 태그 이름은 1~30자여야 합니다.
    Unauthorized:
      description: 인증 실패 (UNAUTHENTICATED, REFRESH_TOKEN_INVALID, REFRESH_TOKEN_REUSED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 권한 부족 (FORBIDDEN, COMMENT_FORBIDDEN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 대상 없음 (ARTICLE_NOT_FOUND, COMMENT_NOT_FOUND, MEDIA_NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 도메인 규칙 위반 (ARTICLE_NOT_PUBLISHABLE, INVALID_STATE_TRANSITION, ARTICLE_VERSION_CONFLICT, ARTICLE_DELETED, COMMENT_DEPTH_EXCEEDED, MEDIA_NOT_UPLOADED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.example.com/problems/article-version-conflict
            title: Article version conflict
            status: 409
            detail: 초안이 다른 곳에서 먼저 저장되었습니다. (요청 version 7, 현재 version 8)
            instance: /api/v1/admin/articles/371234567890123/draft
            code: ARTICLE_VERSION_CONFLICT
            requestId: 01JC8V2T6Q9N
    TooManyRequests:
      description: 요청 한도 초과 (RATE_LIMITED)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
      description: 53비트 Snowflake ID (JS Number로 안전한 범위)
      examples: [371234567890123]

    ArticleStatus:
      type: string
      enum: [DRAFT, PUBLISHED, DELETED]

    TagRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 30

    TagCount:
      type: object
      required: [id, name, articleCount]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        articleCount:
          type: integer
          minimum: 0
          description: 이 태그가 붙은 발행 글 수

    ArticleSummary:
      type: object
      required: [id, title, summary, thumbnailUrl, tags, publishedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        summary:
          type: string
          description: 마크다운을 걷어낸 본문 앞 160자
        thumbnailUrl:
          type: [string, 'null']
          format: uri
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRef'
        publishedAt:
          type: string
          format: date-time

    ArticleSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSummary'
        nextCursor:
          type: [string, 'null']

    ArticleDetail:
      type: object
      required: [id, title, contents, thumbnailUrl, tags, publishedAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        contents:
          type: string
          description: 마크다운 본문
        thumbnailUrl:
          type: [string, 'null']
          format: uri
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRef'
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ArticleContents:
      type: object
      required: [title, contents, thumbnailUrl]
      properties:
        title:
          type: string
          maxLength: 200
        contents:
          type: string
          maxLength: 100000
        thumbnailUrl:
          type: [string, 'null']
          format: uri

    AdminArticleSummary:
      type: object
      required: [id, status, title, publishedAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/ArticleStatus'
        title:
          type: string
          description: 초안 제목
        publishedAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminArticleSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminArticleSummary'
        nextCursor:
          type: [string, 'null']

    AdminArticle:
      type: object
      required: [id, status, draft, published, tags, version, publishedAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/ArticleStatus'
        draft:
          $ref: '#/components/schemas/ArticleContents'
        published:
          description: 한 번도 발행하지 않았으면 null
          anyOf:
            - $ref: '#/components/schemas/ArticleContents'
            - type: 'null'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRef'
        version:
          type: integer
          minimum: 0
          description: 낙관적 락 버전. 초안 저장 때 그대로 돌려보냅니다
        publishedAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DraftUpdateRequest:
      type: object
      required: [title, contents, thumbnailUrl, version]
      properties:
        title:
          type: string
          maxLength: 200
          description: 초안에서는 빈 값을 허용합니다. 발행 시 1자 이상이어야 합니다
        contents:
          type: string
          maxLength: 100000
        thumbnailUrl:
          type: [string, 'null']
          format: uri
        version:
          type: integer
          minimum: 0

    TagsUpdateRequest:
      type: object
      required: [tagNames]
      properties:
        tagNames:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 30

    Author:
      type: object
      required: [id, nickname, pictureUrl]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nickname:
          type: string
        pictureUrl:
          type: [string, 'null']
          format: uri

    CommentStatus:
      type: string
      enum: [ACTIVE, DELETED]

    Comment:
      type: object
      required: [id, parentId, author, content, status, createdAt, replies]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        parentId:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        author:
          $ref: '#/components/schemas/Author'
        content:
          type: string
          description: 삭제된 댓글은 빈 문자열
        status:
          $ref: '#/components/schemas/CommentStatus'
        createdAt:
          type: string
          format: date-time
        replies:
          type: array
          description: 최상위 댓글에만 채워지며 대댓글은 항상 빈 배열
          items:
            $ref: '#/components/schemas/Comment'

    CommentCreateRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
        parentId:
          description: 대댓글이면 부모 댓글 ID
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'

    UploadUrlRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760

    UploadUrlResponse:
      type: object
      required: [mediaId, uploadUrl, method, headers, expiresAt, publicUrl]
      properties:
        mediaId:
          $ref: '#/components/schemas/Id'
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          const: PUT
        headers:
          type: object
          description: 업로드 요청에 반드시 함께 보낼 헤더
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: 발급 후 10분
        publicUrl:
          type: string
          format: uri

    Media:
      type: object
      required: [mediaId, publicUrl, status]
      properties:
        mediaId:
          $ref: '#/components/schemas/Id'
        publicUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [PENDING, CONFIRMED]

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: 초 단위 수명
          examples: [900]

    Me:
      type: object
      required: [id, email, nickname, pictureUrl, role]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
        nickname:
          type: string
        pictureUrl:
          type: [string, 'null']
          format: uri
        role:
          type: string
          enum: [ADMIN, USER]

    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - INVALID_CURSOR
        - INVALID_SEARCH_QUERY
        - UNSUPPORTED_MEDIA_TYPE
        - MEDIA_TOO_LARGE
        - UNAUTHENTICATED
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REUSED
        - FORBIDDEN
        - COMMENT_FORBIDDEN
        - ARTICLE_NOT_FOUND
        - COMMENT_NOT_FOUND
        - MEDIA_NOT_FOUND
        - ARTICLE_NOT_PUBLISHABLE
        - INVALID_STATE_TRANSITION
        - ARTICLE_VERSION_CONFLICT
        - ARTICLE_DELETED
        - COMMENT_DEPTH_EXCEEDED
        - MEDIA_NOT_UPLOADED
        - RATE_LIMITED
        - INTERNAL_ERROR

    FieldError:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string

    Problem:
      type: object
      required: [type, title, status, detail, instance, code, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: 사람이 읽을 한국어 문장. 내부 정보는 담지 않습니다
        instance:
          type: string
          description: 요청 경로
        code:
          $ref: '#/components/schemas/ErrorCode'
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
